ht="40" fill="#F2EFE9"/><text x="20" y="886" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#0D1219" text-anchor="start">QUADRO CONCEITUAL 02 · S01 Apresentação · A pergunta — composição ilustrativa, não é fotografia</text><text x="1580" y="886" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#2a3340" text-anchor="end">10–30 % · cortina de baixo · digitação · partes em sequência</text></svg>