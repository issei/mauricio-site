<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><pattern id="hach" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#141B25"/><line x1="0" y1="0" x2="0" y2="14" stroke="#1c2430" stroke-width="5"/></pattern><pattern id="hach-noite" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#0c1118"/><line x1="0" y1="0" x2="0" y2="14" stroke="#141b25" stroke-width="5"/></pattern><clipPath id="m1"><rect x="560" y="150" width="820" height="547"/></clipPath></defs><rect width="1600" height="900" fill="#080C11"/><rect x="0" y="0" width="1600" height="56" fill="#141B25"/><text x="40" y="36" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#F2EFE9" text-anchor="start">Maurício Yokoyama Issei</text><text x="1560" y="36" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" fill="#D0CCC3" text-anchor="end">Início   Carreira   Conteúdos   Vídeos</text><text x="140" y="118" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#8F97A4" text-anchor="start">01</text><text x="140" y="150" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="600" fill="#F2EFE9" text-anchor="start">Maurício Yokoyama Issei</text><line x1="110" y1="126" x2="110" y2="351" stroke="#D4AF6A" stroke-width="3"/><line x1="110" y1="425" x2="110" y2="650" stroke="#D4AF6A" stroke-width="3"/><text x="124" y="382.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#8F97A4" text-anchor="start">o traço racha (61–63 %)</text><text x="124" y="402.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#8F97A4" text-anchor="start">e se repara (76–80 %)</text><rect x="560" y="150" width="820" height="547" fill="url(#hach-noite)" stroke="#5F6979" stroke-width="1"/><text x="970.0" y="370" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#F2EFE9" text-anchor="middle">FOTO A PRODUZIR · Sustentar</text><text x="970.0" y="400" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#8F97A4" text-anchor="middle">monitor de operação à noite, só a luz da tela; sem dado legível</text><rect x="560" y="623" width="820" height="74" fill="#080C11" fill-opacity=".84"/><text x="600" y="669" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="500" fill="#F2EFE9" text-anchor="start">Por que falhou?</text><text x="1356" y="667" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#8F97A4" text-anchor="end">texto real, digitado (72–75 %)</text><text x="560" y="727" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#8F97A4" text-anchor="start">Corte seco para a noite (60 %). A luz da tela sobe (61–68 %).</text><text x="140" y="560" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="500" fill="#F2EFE9" text-anchor="start">Na crise, o tempo conta.</text><text x="140" y="600" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#D0CCC3" text-anchor="start">Com o time, primeiro estabilizo;</text><text x="140" y="628" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#D0CCC3" text-anchor="start">depois vou até a causa raiz.</text><text x="140" y="670" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="500" fill="#D0CCC3" text-anchor="start">A causa vira a próxima pergunta.</text><text x="140" y="738" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#8F97A4" text-anchor="start">sustentar · liderar · evoluir</text><rect x="0" y="860" width="1600" height="40" fill="#F2EFE9"/><text x="20" y="886" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#0D1219" text-anchor="start">QUADRO CONCEITUAL 05 · S01 Apresentação · A noite e a causa — composição ilustrativa, não é fotografia</text><text x="1580" y="886" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#2a3340" text-anchor="end">60–80 % · corte seco · digitação · o traço racha e se repara</text></svg>