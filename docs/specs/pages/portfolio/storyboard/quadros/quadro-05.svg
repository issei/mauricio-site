<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><pattern id="hach" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#141B25"/><line x1="0" y1="0" x2="0" y2="14" stroke="#1c2430" stroke-width="5"/></pattern></defs><rect width="1600" height="900" fill="#0D1219"/><rect x="0" y="0" width="1600" height="56" fill="#141B25"/><text x="40" y="36" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#F2EFE9" text-anchor="start">Maurício Yokoyama Issei</text><text x="1560" y="36" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" fill="#D0CCC3" text-anchor="end">Início   Carreira   Conteúdos   Vídeos</text><text x="140" y="190" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#D4AF6A" text-anchor="start">01</text><line x1="140" y1="204" x2="188" y2="204" stroke="#D4AF6A" stroke-width="3"/><rect x="140" y="240" width="640" height="420" fill="url(#hach)" stroke="#32353a" stroke-width="1"/><text x="460.0" y="442.0" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#F2EFE9" text-anchor="middle">FOTO A PRODUZIR · Validar</text><text x="460.0" y="472.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#8F97A4" text-anchor="middle">duas telas: teste e resultado, sem dado legível</text><rect x="820" y="170" width="640" height="460" fill="url(#hach)" stroke="#32353a" stroke-width="1"/><text x="1140.0" y="392.0" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#F2EFE9" text-anchor="middle">FOTO A PRODUZIR · Sustentar</text><text x="1140.0" y="422.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#8F97A4" text-anchor="middle">monitor de operação à noite, sala em penumbra</text><text x="820" y="700" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="500" fill="#F2EFE9" text-anchor="start">Depois da entrega, o trabalho continua.</text><text x="820" y="740" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#D0CCC3" text-anchor="start">É na operação que aparece o que o projeto não previu.</text><text x="140" y="700" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#8F97A4" text-anchor="start">validar · sustentar</text><rect x="0" y="860" width="1600" height="40" fill="#F2EFE9"/><text x="20" y="886" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#0D1219" text-anchor="start">QUADRO CONCEITUAL 05 · S01 Apresentação · Dia e noite — composição ilustrativa, não é fotografia</text><text x="1580" y="886" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#2a3340" text-anchor="end">64–82 % · cortina horizontal (dia → noite)</text></svg>