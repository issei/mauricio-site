<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><pattern id="hach" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#141B25"/><line x1="0" y1="0" x2="0" y2="14" stroke="#1c2430" stroke-width="5"/></pattern></defs><rect width="1600" height="900" fill="#0D1219"/><rect x="0" y="0" width="1600" height="56" fill="#141B25"/><text x="40" y="36" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#F2EFE9" text-anchor="start">Maurício Yokoyama Issei</text><text x="1560" y="36" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" fill="#D0CCC3" text-anchor="end">Início   Carreira   Conteúdos   Vídeos</text><text x="140" y="190" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#D4AF6A" text-anchor="start">01</text><line x1="140" y1="204" x2="188" y2="204" stroke="#D4AF6A" stroke-width="3"/><rect x="520" y="120" width="940" height="600" fill="url(#hach)" stroke="#32353a" stroke-width="1"/><text x="990.0" y="412.0" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#F2EFE9" text-anchor="middle">FOTO A PRODUZIR · Liderar e colaborar</text><text x="990.0" y="442.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#8F97A4" text-anchor="middle">conversa de pé, 2–3 pessoas; Issei de perfil; outros de costas/desfocados</text><text x="140" y="560" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="500" fill="#F2EFE9" text-anchor="start">Nada importante foi feito</text><text x="140" y="595" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="500" fill="#F2EFE9" text-anchor="start">por uma pessoa só.</text><text x="140" y="640" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#D0CCC3" text-anchor="start">Liderar é deixar o problema claro</text><text x="140" y="668" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#D0CCC3" text-anchor="start">e abrir espaço para quem resolve.</text><text x="1460" y="760" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#8F97A4" text-anchor="end">liderar · colaborar</text><rect x="0" y="860" width="1600" height="40" fill="#F2EFE9"/><text x="20" y="886" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#0D1219" text-anchor="start">QUADRO CONCEITUAL 04 · S01 Apresentação · A conversa — composição ilustrativa, não é fotografia</text><text x="1580" y="886" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#2a3340" text-anchor="end">48–64 % · pull-out 1,06→1,00</text></svg>