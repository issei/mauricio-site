ont-size="14" font-weight="400" fill="#8F97A4" text-anchor="start">No celular, B e C entram dentro de M1 por cortina lateral.</text><rect x="0" y="860" width="1600" height="40" fill="#F2EFE9"/><text x="20" y="886" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#0D1219" text-anchor="start">QUADRO CONCEITUAL 04 · S01 Apresentação · Do diagrama ao teste — composição ilustrativa, não é fotografia</text><text x="1580" y="886" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#2a3340" text-anchor="end">42–60 % · abre do centro · pan · B e C sobre o canto</text></svg>