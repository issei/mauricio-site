<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><pattern id="hach" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#141B25"/><line x1="0" y1="0" x2="0" y2="14" stroke="#1c2430" stroke-width="5"/></pattern><pattern id="hach-noite" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#0c1118"/><line x1="0" y1="0" x2="0" y2="14" stroke="#141b25" stroke-width="5"/></pattern><clipPath id="m1"><rect x="560" y="150" width="820" height="547"/></clipPath></defs><rect width="1600" height="900" fill="#080C11"/><rect x="0" y="0" width="1600" height="56" fill="#141B25"/><text x="40" y="36" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#F2EFE9" text-anchor="start">Maurício Yokoyama Issei</text><text x="1560" y="36" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" fill="#D0CCC3" text-anchor="end">Início   Carreira   Conteúdos   Vídeos</text><text x="140" y="118" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#8F97A4" text-anchor="start">01</text><text x="140" y="150" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="600" fill="#F2EFE9" text-anchor="start">Maurício Yokoyama Issei</text><line x1="110" y1="126" x2="110" y2="650" stroke="#D4AF6A" stroke-width="3" stroke-dasharray="4 10" opacity=".35"/><text x="124" y="672" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#8F97A4" text-anchor="start">o traço lateral some nesta cena</text><rect x="560" y="150" width="820" height="547" fill="none" stroke="#2a3340" stroke-dasharray="8 8"/><text x="970.0" y="383.5" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#8F97A4" text-anchor="middle">a moldura fecha ao centro (30–33,5 %)</text><rect x="560" y="422.0" width="820" height="3" fill="#D4AF6A"/><text x="970.0" y="469.5" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#8F97A4" text-anchor="middle">o traço dourado cresce e fica parado: é o silêncio da página</text><text x="560" y="727" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#8F97A4" text-anchor="start">Nenhuma imagem. As fontes fecharam; só a explicação conta agora.</text><text x="140" y="560" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="500" fill="#F2EFE9" text-anchor="start">Então fecho as fontes e tento explicar.</text><text x="140" y="600" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#D0CCC3" text-anchor="start">É aí que descubro o que eu</text><text x="140" y="628" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#D0CCC3" text-anchor="start">só reconhecia.</text><text x="140" y="720" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#8F97A4" text-anchor="start">aprender</text><rect x="0" y="860" width="1600" height="40" fill="#F2EFE9"/><text x="20" y="886" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#0D1219" text-anchor="start">QUADRO CONCEITUAL 03 · S01 Apresentação · Fechar e explicar — composição ilustrativa, não é fotografia</text><text x="1580" y="886" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#2a3340" text-anchor="end">30–42 % · cortina ao centro · traço · silêncio</text></svg>