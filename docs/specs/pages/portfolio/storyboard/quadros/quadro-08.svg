<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><pattern id="hach" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#141B25"/><line x1="0" y1="0" x2="0" y2="14" stroke="#1c2430" stroke-width="5"/></pattern></defs><rect width="1600" height="900" fill="#0D1219"/><rect x="0" y="0" width="1600" height="56" fill="#141B25"/><text x="40" y="36" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#F2EFE9" text-anchor="start">Maurício Yokoyama Issei</text><text x="1560" y="36" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" fill="#D0CCC3" text-anchor="end">Início   Carreira   Conteúdos   Vídeos</text><text x="140" y="190" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#D4AF6A" text-anchor="start">03</text><line x1="140" y1="204" x2="188" y2="204" stroke="#D4AF6A" stroke-width="3"/><text x="140" y="280" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="500" fill="#F2EFE9" text-anchor="start">Minhas ideias</text><text x="140" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="500" fill="#F2EFE9" text-anchor="start">As ferramentas mudaram; as perguntas, não.</text><text x="140" y="366" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#D0CCC3" text-anchor="start">Hoje estudo agentes de IA perguntando o mesmo de sempre:</text><text x="140" y="392" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#D0CCC3" text-anchor="start">quem vai operar, o que pode falhar, como saber se funciona.</text><text x="140" y="418" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#D0CCC3" text-anchor="start">Escrevo e gravo o que ainda estou tentando entender.</text><text x="140" y="470" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#8F97A4" text-anchor="start">Recentes</text><text x="140" y="510" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="500" fill="#F2EFE9" text-anchor="start">A quem a empresa delega quando delega à IA?</text><text x="640" y="510" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#8F97A4" text-anchor="start">Artigo</text><text x="140" y="548" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="500" fill="#F2EFE9" text-anchor="start">Curiosidade e investigação</text><text x="640" y="548" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#8F97A4" text-anchor="start">Ensaio</text><text x="140" y="586" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="500" fill="#F2EFE9" text-anchor="start">Domine a IA com Google Antigravity</text><text x="640" y="586" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#8F97A4" text-anchor="start">Vídeo</text><text x="140" y="680" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" fill="#D4AF6A" text-anchor="start">Explore minhas ideias  →</text><text x="470" y="680" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#F2EFE9" text-anchor="start">Vídeos do canal  →</text><rect x="880" y="140" width="420" height="300" fill="url(#hach)" stroke="#32353a" stroke-width="1"/><text x="1090.0" y="282.0" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#F2EFE9" text-anchor="middle">VÍDEO EXISTENTE</text><text x="1090.0" y="312.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#8F97A4" text-anchor="middle">quadro de gravação (a selecionar)</text><rect x="1060" y="320" width="400" height="280" fill="url(#hach)" stroke="#32353a" stroke-width="1"/><text x="1260.0" y="452.0" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#F2EFE9" text-anchor="middle">PÁGINA EXISTENTE</text><text x="1260.0" y="482.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#8F97A4" text-anchor="middle">captura de um estudo do site (a editar)</text><rect x="900" y="520" width="380" height="240" fill="url(#hach)" stroke="#32353a" stroke-width="1"/><text x="1090.0" y="632.0" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#F2EFE9" text-anchor="middle">FOTO A PRODUZIR</text><text x="1090.0" y="662.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#8F97A4" text-anchor="middle">caderno de anotações</text><rect x="0" y="860" width="1600" height="40" fill="#F2EFE9"/><text x="20" y="886" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#0D1219" text-anchor="start">QUADRO CONCEITUAL 08 · S03 Minhas ideias · A mesa de estudo — composição ilustrativa, não é fotografia</text><text x="1580" y="886" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#2a3340" text-anchor="end">130 vh · parallax 0 / 3 / 6 %</text></svg>