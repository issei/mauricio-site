name: CI - Quality Gate (engenharia-agentes-ia)

# Gate de regressão (separado do deploy.yml). Roda o quality gate em PRs e em
# pushes na main como rede de segurança. NÃO faz deploy.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  gate:
    name: Build + Playwright + a11y
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run quality gate
        run: node scripts/quality-gate.mjs
        env:
          CI: 'true'
