name: CI - Quality Gate

# Gate de regressão (separado do deploy.yml). NÃO faz deploy.
#
# Caminho crítico = max(static, shard mais lento), não a soma: o job estático
# (build, geradores, i18n, node:test, varredura a11y, perf) roda em paralelo
# com o Playwright fatiado por navegador (2 chromium, 3 firefox, 4 webkit) + 3 @lento.
#
# Camadas (docs/specs/TESTING_GUIDE.md, "CI/CD Integration"):
#   fast (pull_request)               chromium + mobile + no-js
#   full (push main, nightly, manual) + firefox + webkit
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *' # 03:00 BRT — regressão completa diária
  workflow_dispatch:

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'
  TIER: ${{ github.event_name == 'pull_request' && 'fast' || 'full' }}

jobs:
  static:
    name: Build + invariantes + a11y sweep
    runs-on: ubuntu-24.04 # Playwright 1.58 não instala navegadores no ubuntu-latest (26.04)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-fast-${{ hashFiles('package-lock.json') }}

      # Com o cache restaurado, o download é pulado; só as libs de sistema (apt) instalam.
      - name: Install Chromium (a11y sweep)
        run: npx playwright install --with-deps chromium

      - name: Gate sem Playwright
        run: node scripts/quality-gate.mjs --no-e2e

  e2e:
    name: Playwright ${{ matrix.nome }} (${{ github.event_name == 'pull_request' && 'fast' || 'full' }})
    runs-on: ubuntu-24.04 # Playwright 1.58 não instala navegadores no ubuntu-latest (26.04)
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # O sharding do Playwright corta a lista ORDENADA de testes em blocos contíguos,
      # balanceados por contagem, não por duração. Com 6 shards sobre a lista inteira,
      # o bloco do WebKit (o dobro do custo por teste) e os testes de Tab longos caíam
      # nos mesmos shards: 208–552 s no run 38151493624. Agora cada navegador tem seus
      # shards, dimensionados pela carga medida (chromium 626 s, firefox 709 s, webkit
      # 1.203 s de worker), e os @lento (focus-visible, banner de cookies) têm os seus.
      # docs/specs/QUALITY_GATE_PARALELO.md, P4.
      # PWTEST_SHARD_WEIGHTS (lido pelo Playwright 1.58, program.js): quantos testes cada shard
      # recebe, na ordem da lista. Calculados com as durações reais do run 38154440101 para
      # equalizar o TEMPO, não a contagem (simulado: 100–171 s de teste por shard, razão 1,07).
      # A soma dos pesos era a contagem de testes do grupo; testes novos mudam a proporção,
      # não quebram nada. Se uma versão futura ignorar a variável, o corte volta a ser igual.
      # Recalcular: docs/specs/QUALITY_GATE_PARALELO.md §8.2c.
      matrix:
        include:
          - { nome: 'chromium 1/2', projetos: '--project=chromium --project=mobile --project=no-js', shard: 1, total: 2, filtro: '--grep-invert @lento', so_full: false, pesos: '246:298' }
          - { nome: 'chromium 2/2', projetos: '--project=chromium --project=mobile --project=no-js', shard: 2, total: 2, filtro: '--grep-invert @lento', so_full: false, pesos: '246:298' }
          - { nome: 'firefox 1/3', projetos: '--project=firefox', shard: 1, total: 3, filtro: '--grep-invert @lento', so_full: true, pesos: '109:177:141' }
          - { nome: 'firefox 2/3', projetos: '--project=firefox', shard: 2, total: 3, filtro: '--grep-invert @lento', so_full: true, pesos: '109:177:141' }
          - { nome: 'firefox 3/3', projetos: '--project=firefox', shard: 3, total: 3, filtro: '--grep-invert @lento', so_full: true, pesos: '109:177:141' }
          - { nome: 'webkit 1/4', projetos: '--project=webkit', shard: 1, total: 4, filtro: '--grep-invert @lento', so_full: true, pesos: '60:123:143:101' }
          - { nome: 'webkit 2/4', projetos: '--project=webkit', shard: 2, total: 4, filtro: '--grep-invert @lento', so_full: true, pesos: '60:123:143:101' }
          - { nome: 'webkit 3/4', projetos: '--project=webkit', shard: 3, total: 4, filtro: '--grep-invert @lento', so_full: true, pesos: '60:123:143:101' }
          - { nome: 'webkit 4/4', projetos: '--project=webkit', shard: 4, total: 4, filtro: '--grep-invert @lento', so_full: true, pesos: '60:123:143:101' }
          - { nome: 'lento 1/3', projetos: '', shard: 1, total: 3, filtro: '--grep @lento', so_full: false, pesos: '13:16:5' }
          - { nome: 'lento 2/3', projetos: '', shard: 2, total: 3, filtro: '--grep @lento', so_full: false, pesos: '13:16:5' }
          - { nome: 'lento 3/3', projetos: '', shard: 3, total: 3, filtro: '--grep @lento', so_full: false, pesos: '13:16:5' }
    env:
      # Na camada fast (PR) os shards de firefox/webkit não têm o que rodar: pulam todos os passos.
      PULA: ${{ github.event_name == 'pull_request' && matrix.so_full }}
    steps:
      - uses: actions/checkout@v4
        if: env.PULA != 'true'

      - uses: actions/setup-node@v4
        if: env.PULA != 'true'
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci
        if: env.PULA != 'true'

      - name: Cache Playwright browsers
        if: env.PULA != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ env.TIER }}-${{ hashFiles('package-lock.json') }}

      - name: Install browsers
        if: env.PULA != 'true'
        run: |
          if [ "$TIER" = fast ]; then npx playwright install --with-deps chromium
          else npx playwright install --with-deps; fi

      - name: Playwright (${{ matrix.nome }})
        if: env.PULA != 'true'
        run: |
          PROJECTS="${{ matrix.projetos }}"
          # lento: na fast só o chromium; na full, todos os navegadores
          [ -z "$PROJECTS" ] && [ "$TIER" = fast ] && PROJECTS="--project=chromium"
          PWTEST_SHARD_WEIGHTS="${{ matrix.pesos }}" npx playwright test --shard=${{ matrix.shard }}/${{ matrix.total }} ${{ matrix.filtro }} $PROJECTS --pass-with-no-tests

      - name: Upload blob report
        if: ${{ !cancelled() && env.PULA != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ strategy.job-index }}
          path: blob-report
          retention-days: 3

  report:
    name: Relatório Playwright (merge)
    if: ${{ !cancelled() }}
    needs: e2e
    runs-on: ubuntu-24.04 # Playwright 1.58 não instala navegadores no ubuntu-latest (26.04)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - run: npx playwright merge-reports --reporter html ./all-blob-reports

      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  # Check único para a branch protection: verde só se static E todos os shards passaram.
  gate:
    name: Quality Gate
    if: always()
    needs: [static, e2e]
    runs-on: ubuntu-24.04 # Playwright 1.58 não instala navegadores no ubuntu-latest (26.04)
    steps:
      - name: Resultado
        run: |
          echo "static=${{ needs.static.result }} e2e=${{ needs.e2e.result }}"
          [ "${{ needs.static.result }}" = success ] && [ "${{ needs.e2e.result }}" = success ]
