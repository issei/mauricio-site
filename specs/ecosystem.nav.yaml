# =============================================================================
# ecosystem.nav.yaml — fonte única da lista de conteúdos do site
# -----------------------------------------------------------------------------
# Daqui saem o catálogo (/catalogo, entre os marcadores CATALOGO) e os dados do
# menu <eco-nav> (src/js/eco-nav.data.js), pelo scripts/gen-catalogo.mjs.
# Não edite o catálogo nem o eco-nav.data.js à mão: edite este arquivo e rode
#   node scripts/gen-catalogo.mjs
# Spec: docs/specs/arquitetura-informacao/SDD-F1-F1b.md (Parte 1).
#
# Governança (SPEC §4.4): agentes que editam UMA página individual NÃO alteram
# este arquivo, a ordem dos pilares nem o glossário sem bump de `meta.version`
# e aprovação humana. Qualquer alteração de grafo → bump de versão.
#
# Invariantes (SDD-F1-F1b §3.2; tests/ecosystem.schema.test.mjs aplica todos):
#   INV-1  todo slug de pillars[].nodes existe em `nodes`
#   INV-2  `pillars` tem 4 itens, na ordem 1 a 4
#   INV-3  todo `file` corresponde a um arquivo real em src/
#   INV-4  crosslinks[].from/to são slugs válidos
#   INV-5  URLs derivadas usam meta.canonical_base, exceto os href absolutos
#          já previstos (/videos.html)
#   INV-6  todo nó tem `kind` em KINDS, `natureza` na lista e `temas` válidos
#          (1 a 3 nos pilares; 0 a 3 na trajetória)
#   INV-7  toda página autoral do sitemap é um nó, uma entrada ou página legal
#          (exceção listada: lifeos)
#   INV-8  o catálogo entre os marcadores é igual à saída do gerador
#
# Campos de um nó: file, title, label (rótulo curto de menu), blurb (≤ 60
# caracteres, menu), pillar, kind, natureza, temas, descricao (texto do cartão),
# e os opcionais cartao_titulo, assunto (depois do formato na etiqueta),
# chamada (texto do link do cartão), selo (crosslink no cartão), catalogo
# (false esconde o cartão) e par.
# =============================================================================

meta:
  version: "2.0.0"           # semver; bump obrigatório a cada alteração de grafo
  canonical_base: "./"        # decisão D-05 (revisada no HITL): URL relativa atual
  author: "Maurício Yokoyama Issei"
  updated: "2026-11-10"
  # 2.0.0 — reestruturação F1 (PROPOSTA-REESTRUTURACAO.md, decisões D3, D4, D5 e D7
  #         do autor em 2026-11-10; classificação do SDD-F1-F1b, Anexo A, confirmada).
  #         Sai o pilar p5: socialselling vai para p3 e boutique-empresarial-showcase
  #         para p2; index e videos vão para `entradas`; life, life3d e
  #         terminal-evolutivo vão para `trajetoria`. Entram os nós que o catálogo já
  #         tinha e o YAML não (capacidade-antes-do-acesso, curiosidade-e-investigacao,
  #         aprendizagem-autorregulada e o par -artigo, operacao-capital-cognitivo,
  #         digital-workplace-agentico). Todo nó ganha kind, natureza, temas e o texto
  #         do cartão. eco-nav.js deixa de ter cópia própria: lê eco-nav.data.js.
  # Histórico 1.x:
  # 1.13.0 — entra `videos` (Vídeos do canal) em p5 (Soluções & Portfólio): índice
  #         gerado por scripts/gen-videos.mjs a partir do canal do YouTube. Pedido pelo
  #         autor em 2026-11-07. A página não tem gêmeo /en/ na fase 1, então o link é
  #         absoluto (`/videos.html`) para não virar /en/videos.html nas páginas em inglês.
  #         Atualizar src/js/eco-nav.js junto.
  # 1.12.0 — entra `da-execucao-a-orquestracao` (Da execução à orquestração do
  #         trabalho) em p1 (Fundação/Mentalidade): áudio comentado com auditoria das
  #         afirmações. Pedido pelo autor em 2026-10-28 (a página saiu no PR #129 sem
  #         entrar no menu). Atualizar src/js/eco-nav.js junto.
  # 1.11.0 — entra `especificacao-conversacional` (Especificação Conversacional
  #         Estruturada) em p2 (Engenharia de Confiança / O Método): workflow proposto
  #         para elicitar requisitos com IA sob autoridade humana. Dois crosslinks,
  #         ambos já presentes na origem (engenharia-confianca, devin). Aprovado pelo
  #         autor em 2026-10-10 (D-5 do wireframe). Atualizar src/js/eco-nav.js junto.
  # 1.10.0 — sai `proposta`: a página virou proposta executiva não listada (noindex),
  #         fora do grafo público. Atualizar src/js/eco-nav.js junto.
  # 1.9.0 — entra `acessibilidade` (Acessibilidade como requisito de engenharia)
  #         em p2 (Engenharia de Confiança / O Método): case do retrofit WCAG 2.2
  #         com o A11Y.md como contexto dos agentes. Aprovado pelo autor em
  #         2026-10-06. Atualizar src/js/eco-nav.js junto (cópia compilada da SSOT).
  # 1.8.0 — entra `boutique-empresarial-showcase` em p5 (Soluções & Portfólio):
  #         showcase de arquitetura/SDD/pipeline agêntico do projeto Boutique
  #         Empresarial. canonical: false, mesmo tratamento de
  #         proposta-observabilidade-mobile (extra fora dos 16 canônicos).
  #         Atualizar src/js/eco-nav.js junto (cópia compilada da SSOT).
  # 1.7.0 — entra `develop-engineering` (Deterministic Grounding) em p2
  #         (Engenharia de Confiança / O Método): ancoramento de estado,
  #         Snapshot Capsule, Action Gateway e oráculos auditáveis.
  # 1.6.0 — entra `case-agents` (Case Agents) em p2 (Engenharia de Confiança/
  #         O Método): roteamento de queries, seleção de 2 de 285 tools e
  #         barreira pré-execução de 4 camadas num agente bancário.
  # 1.5.0 — entra `agent-ready` (Agent Ready) em p2 (Engenharia de Confiança/
  #         O Método): a fronteira agente↔sistema publicada na Web como
  #         superfície descobrível, legível e invocável. Fica no mesmo pilar de
  #         `engenharia-agentes-ia`, que trata a mesma fronteira por dentro.
  #         Atualizar src/js/eco-nav.js junto (cópia compilada da SSOT).
  # 1.4.0 — entra `formulacao-de-problemas` (Formulação de Problemas) em p1
  #         (Fundação/Mentalidade): resolve a decisão pendente D-1 do doc de
  #         spec da página, que deixou a página fora do grafo por padrão.
  #         Atualizar src/js/eco-nav.js junto (cópia compilada da SSOT).
  # 1.3.0 — entra `artifice` (O Artífice Invisível) em p1 (Fundação/Mentalidade):
  #         diagnóstico sociológico da invisibilidade da maestria técnica, no
  #         mesmo pilar de `know` e `devin`. Atualizar src/js/eco-nav.js junto
  #         (cópia compilada da SSOT) — ver ECOSYSTEM.md.
  # 1.2.0 — entra `apresentacao` em p2 (Arquitetura de IA auditável) e o nó
  #         `terminal-evolutivo` em p5, que existia apenas na cópia compilada
  #         de src/js/eco-nav.js (1.1.0). O YAML tinha ficado para trás: as duas
  #         cópias desta SSOT precisam ser editadas juntas — ver ECOSYSTEM.md.


# Decisões humanas que liberaram esta SSOT (HITL — SPEC §7/§8), registradas
# para rastreabilidade. Não são consumidas pelo gerador.
hitl_decisions:
  url_convention: "relativa-atual"          # ./arquivo.html (não relativa-raiz)
  devops_title_canonico: "DevOps Salesforce — Entrega Contínua Agêntica"
  devops_title_nota: >-
    O <title> da página devops-salesforce.html NÃO está vazio (premissa
    RESEARCH §4.1 ficou obsoleta). A página já usa
    "Arquitetura Híbrida DevOps Salesforce | Flosum + GitHub + Devin AI",
    que foi mantido. O título canônico acima vale como rótulo de menu.
  life_e_life3d: "na trajetória desde 2.0.0; life3d rotulado (3D) no menu"
  crosslinks_proposed: "aprovados — materializar links reais na origem"
  lifeos: "fora do YAML por decisão do autor (2026-11-10, Q5): publicado, sem link"

# ----- Entradas: páginas de entrada, que não são conteúdo (alimentam o cabeçalho
# comum da F1b). href absoluto só onde não há gêmeo /en/.
entradas:
  - id: index
    file: "index.html"
    label: "Início"
    label_en: "Home"
  - id: curriculo
    file: "curriculo.html"
    label: "Trajetória"
    label_en: "Career"
    titulo: "Currículo"
    descricao: "Experiência profissional, formação, certificações e os resultados em formato STAR."
    chamada: "Ver a trajetória →"
  - id: catalogo
    file: "catalogo.html"
    label: "Produção"
    label_en: "Work"
  - id: videos
    file: "/videos.html"     # absoluto: sem gêmeo /en/ na fase 1 dos vídeos
    label: "Vídeos"
    label_en: "Videos"
    titulo: "Vídeos do canal"
    descricao: "Os vídeos do canal no YouTube, organizados por assunto."
    chamada: "Ver os vídeos →"

# ----- Trajetória: narrativas pessoais, sem pilar. Ordem = ordem no catálogo.
trajetoria: [life, life3d, terminal-evolutivo]

# ----- Pilares: ordem = jornada CA-01 (NÃO reordenar sem bump major) ----------
# summary = texto curto do menu; resumo = texto do catálogo; conector = frase
# entre o pilar anterior e este, no catálogo.
pillars:
  - id: p1
    order: 1
    label: "Fundação"
    subtitle: "Mentalidade"
    summary: "Princípios de pensamento sistêmico e gestão do conhecimento."
    resumo: "Princípios de pensamento sistêmico e gestão do conhecimento — o ponto de partida antes de qualquer ferramenta."
    nodes: [know, devin, formulacao-de-problemas, capacidade-antes-do-acesso, artifice, curiosidade-e-investigacao, aprendizagem-autorregulada, aprendizagem-autorregulada-artigo, da-execucao-a-orquestracao]

  - id: p2
    order: 2
    label: "Engenharia de Confiança"
    subtitle: "O Método"
    summary: "Da intenção à execução agêntica confiável."
    resumo: "Da intenção à execução agêntica confiável — a disciplina-ponte que transforma mentalidade em método."
    conector: "herda o pensamento sistêmico"
    nodes: [apresentacao, engenharia-confianca, engenharia-agentes-ia, develop-engineering, operacao-capital-cognitivo, agent-ready, case-agents, knowledge-os-presentation, digital-workplace-agentico, acessibilidade, especificacao-conversacional, boutique-empresarial-showcase]

  - id: p3
    order: 3
    label: "Ecossistema Salesforce"
    subtitle: "A Aplicação"
    summary: "Métodos agênticos aplicados à plataforma Salesforce."
    resumo: "Métodos agênticos aplicados à plataforma Salesforce — onde o método encontra a engenharia real."
    conector: "aplica o método"
    nodes: [devops-salesforce, proposta-engenharia-reversa, salesforce-agentic-quickstart, salesforce-agentic-dev, socialselling]

  - id: p4
    order: 4
    label: "Sustentação & Resiliência"
    subtitle: "O Valor"
    summary: "Operação de serviço, SRE e resiliência em produção."
    resumo: "Operação de serviço, SRE e resiliência em produção — onde a engenharia entregue se prova ao longo do tempo."
    conector: "é sustentado por"
